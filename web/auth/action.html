<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8B10F2">
<title>CampusFix · Account</title>
<link rel="icon" href="/favicon.png">
<style>
  :root { --p:#8B10F2; --pd:#6A0BD8; --bg:#F7F6FB; --t:#16142B; --m:#6E6B85; --b:#ECEAF3; --ok:#1E9E63; --err:#E5484D; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: linear-gradient(135deg,#9B2CF8,#6A0BD8); color: var(--t); }
  .card { width:100%; max-width:420px; background:#fff; border-radius:24px; padding:32px 28px;
          box-shadow: 0 20px 50px rgba(42,18,89,.35); text-align:center; }
  .logo { width:64px; height:64px; border-radius:18px; display:block; margin:0 auto 18px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:var(--m); line-height:1.5; margin:0 0 20px; font-size:15px; }
  .icon { width:72px; height:72px; border-radius:50%; display:grid; place-items:center; margin:0 auto 16px; font-size:34px; }
  .ok { background:#DDF6EA; color:var(--ok); } .bad { background:#FDE4E5; color:var(--err); } .wait { background:#F3E8FF; color:var(--p); }
  .spin { width:30px; height:30px; border:3px solid #E4D3FB; border-top-color:var(--p); border-radius:50%; animation:s 0.8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  label { display:block; text-align:left; font-weight:700; font-size:14px; margin:0 0 6px; }
  input { width:100%; padding:14px 16px; border:1px solid var(--b); border-radius:12px; font-size:15px; margin-bottom:14px; }
  input:focus { outline:none; border-color:var(--p); box-shadow:0 0 0 3px #F3E8FF; }
  button { width:100%; padding:15px; border:0; border-radius:16px; background:var(--p); color:#fff; font-weight:700; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { font-size:13px; color:var(--err); text-align:left; min-height:18px; margin:-8px 0 12px; }
  .small { font-size:13px; margin-top:18px; margin-bottom:0; }
</style>
</head>
<body>
<main class="card" id="card" aria-live="polite">
  <img class="logo" src="/icons/Icon-192.png" alt="CampusFix">
  <div class="icon wait"><div class="spin"></div></div>
  <h1>One moment…</h1>
  <p>Checking your link.</p>
</main>
<script>
// Handles Firebase Auth email actions without relying on the link's apiKey parameter
// (links sent from some SDKs arrive with an empty apiKey, which breaks the default page).
const API_KEY = 'AIzaSyCAKgq5DV58zDeVqD6vqYrvhypFg3khJFE'; // public web key (safe to embed)
const API = 'https://identitytoolkit.googleapis.com/v1/accounts';
const q = new URLSearchParams(location.search.replace(/&amp;/g, '&')); // also tolerate HTML-escaped links
const mode = q.get('mode'), code = q.get('oobCode');
const card = document.getElementById('card');

const ERRORS = {
  EXPIRED_OOB_CODE: 'This link has expired. Open CampusFix and tap “Resend email” to get a new one.',
  INVALID_OOB_CODE: 'This link is invalid or has already been used. If you already verified, just go back to the app.',
  USER_DISABLED: 'This account has been disabled.',
  WEAK_PASSWORD: 'Choose a password with at least 8 characters.',
};
const msg = (e) => ERRORS[String(e).split(' ')[0]] ?? 'Something went wrong. Please try again from the app.';

async function call(path, body) {
  const r = await fetch(`${API}:${path}?key=${API_KEY}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw j.error?.message ?? 'UNKNOWN';
  return j;
}

function show(kind, title, text, extra = '') {
  const icon = { ok: '✓', bad: '!', wait: '<div class="spin"></div>' }[kind];
  card.innerHTML = `<img class="logo" src="/icons/Icon-192.png" alt="CampusFix">
    <div class="icon ${kind}">${icon}</div><h1>${title}</h1><p>${text}</p>${extra}`;
}
const backToApp = '<p class="small">You can close this page and return to the CampusFix app.</p>';

async function verifyEmail() {
  const r = await call('update', { oobCode: code });
  show('ok', 'Email verified', `<b>${r.email}</b> is confirmed. In the app, tap “I’ve verified my email” to continue.`, backToApp);
}

async function resetPassword() {
  const { email } = await call('resetPassword', { oobCode: code }); // validates code, returns email
  show('wait', 'Choose a new password', `For <b>${email}</b>`, `
    <form id="f" novalidate>
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
      <div class="hint" id="hint"></div>
      <button id="go">Save password</button>
    </form>`);
  card.querySelector('.icon').innerHTML = '🔒';
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
    const hint = document.getElementById('hint'), btn = document.getElementById('go');
    if (pw.length < 8) return (hint.textContent = 'At least 8 characters.');
    if (pw !== pw2) return (hint.textContent = 'Passwords do not match.');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await call('resetPassword', { oobCode: code, newPassword: pw });
      show('ok', 'Password updated', 'Sign in to CampusFix with your new password.', backToApp);
    } catch (err) { hint.textContent = msg(err); btn.disabled = false; btn.textContent = 'Save password'; }
  });
}

async function recoverEmail() {
  const r = await call('update', { oobCode: code });
  show('ok', 'Email restored', `Your account email is back to <b>${r.email}</b>. We recommend resetting your password from the app.`, backToApp);
}

(async () => {
  if (!code) return show('bad', 'Link incomplete', 'This link is missing its code. Open the newest email from CampusFix and tap the button again.');
  try {
    if (mode === 'verifyEmail') await verifyEmail();
    else if (mode === 'resetPassword') await resetPassword();
    else if (mode === 'recoverEmail') await recoverEmail();
    else show('bad', 'Unsupported link', 'This link type is not supported. Please try again from the app.');
  } catch (err) {
    show('bad', 'Link not valid', msg(err));
  }
})();
</script>
</body>
</html>
